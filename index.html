<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Sevenqorse Hub</title>
<link rel="icon" id="fav" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
/* Marka renkleri: sitenizdeki renklere göre buradan değiştirin */
:root{--bg:#0a0818;--panel:#130f2b;--ink:#efecff;--muted:#a49fc8;--line:#2b2556;--c1:#5b48b8;--c2:#a99bff;--c3:#7b6ae8;--tile:#f4f7fb}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;padding-top:env(safe-area-inset-top,0px);overflow:hidden}
button,a{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--c2);outline-offset:2px}
[hidden]{display:none!important}

/* arka plan */
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.orb{position:fixed;border-radius:50%;filter:blur(90px);opacity:.45;z-index:0;pointer-events:none;animation:drift 18s ease-in-out infinite alternate}
.o1{width:46vmax;height:46vmax;background:var(--c1);left:-14vmax;top:-18vmax}
.o2{width:38vmax;height:38vmax;background:var(--c2);right:-12vmax;bottom:-16vmax;animation-delay:-6s;opacity:.3}
.o3{width:28vmax;height:28vmax;background:var(--c3);left:38%;top:30%;animation-delay:-11s;opacity:.18}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.18)}}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(ellipse at center,#000 30%,transparent 80%)}
header.top,.stage,.dock{position:relative;z-index:1}

/* üst bar */
header.top{display:flex;align-items:center;gap:12px;padding:12px 16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.01em;font-size:1.15rem}
.brand{background:#f6f4ff;padding:6px 12px 6px 8px;border-radius:16px;box-shadow:0 0 26px rgba(91,72,184,.5)}
.bi{height:34px;width:34px;border-radius:9px}.bw{height:18px;width:auto}
.hub{font-weight:800;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c3));padding:4px 8px;border-radius:8px}
.mark{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--c1),var(--c2));font-weight:800;font-size:.9rem;color:#fff}
.cta{margin-left:auto;position:relative;overflow:hidden;text-decoration:none;font-weight:600;padding:9px 16px;border-radius:999px;background:linear-gradient(90deg,var(--c1),var(--c3));box-shadow:0 0 22px rgba(91,72,184,.5)}
.cta::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:shine 3.2s ease-in-out infinite}
@keyframes shine{to{left:130%}}

/* pencere */
.stage{min-height:0;padding:4px 14px 0 60px}
.window{height:100%;display:flex;flex-direction:column;background:rgba(19,15,43,.82);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 0 0 1px rgba(91,72,184,.15),0 20px 60px rgba(0,0,0,.45)}
.window.pop{animation:pop .55s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{transform:scale(.94);filter:blur(8px);opacity:.3}to{transform:none;filter:none;opacity:1}}
.bar{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);min-height:48px}
.bar-i{width:24px;height:24px;border-radius:7px;flex:none}
.who{flex:1;min-width:0}
#title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#path{font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:9px;padding:6px 11px;font-size:.88rem;cursor:pointer;text-decoration:none;white-space:nowrap;transition:border-color .2s,box-shadow .2s}
.btn:hover{border-color:var(--c2);box-shadow:0 0 14px rgba(169,155,255,.3)}
.btn[aria-pressed="true"]{background:var(--c1);border-color:var(--c1)}

.view{position:relative;flex:1;min-height:0;display:flex;justify-content:center;--px:50%;--py:40%;background:radial-gradient(500px circle at var(--px) var(--py),rgba(91,72,184,.16),transparent 70%)}
.view::before{content:"";position:absolute;right:-70px;bottom:-70px;width:400px;height:400px;background:var(--icon) center/contain no-repeat;opacity:.06;pointer-events:none;z-index:0;animation:float 7s ease-in-out infinite}
.view iframe{position:relative;z-index:1;width:100%;height:100%;border:0;background:#fff;opacity:0;transition:opacity .35s}
.view.ready iframe{opacity:1}
.view.mobile iframe{width:390px;max-width:100%;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.view.loading::after{content:"";position:absolute;left:0;top:0;height:3px;width:40%;background:linear-gradient(90deg,var(--c1),var(--c2),var(--c3));box-shadow:0 0 14px var(--c2);animation:slide 1s ease-in-out infinite}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(260%)}}

/* karşılama */
#welcome{position:relative;z-index:1;align-self:center;display:flex;flex-direction:column;align-items:center;text-align:center;padding:20px;max-width:40rem}
@keyframes spin{to{--a:360deg}}
@keyframes float{50%{translate:0 -10px}}
.hero-logo{width:120px;height:120px;border-radius:30px;animation:float 5s ease-in-out infinite;filter:drop-shadow(0 14px 30px rgba(91,72,184,.65))}
#welcome h1{margin-top:22px;font-size:clamp(2.3rem,7vw,3.8rem);font-weight:800;letter-spacing:-.03em;line-height:1.05;background:linear-gradient(100deg,var(--ink) 20%,var(--c2),var(--c3),var(--c1),var(--ink) 80%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 6s linear infinite}
@keyframes flow{to{background-position:-250% 0}}
#welcome p{margin-top:12px;color:var(--muted);font-size:1.05rem;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:20px}
.chips span{padding:6px 12px;border:1px solid var(--line);border-radius:999px;font-size:.85rem;background:rgba(255,255,255,.03);animation:float 4.5s ease-in-out infinite}
.chips span:nth-child(2){animation-delay:-1.5s}.chips span:nth-child(3){animation-delay:-3s}

/* instagram */
.ig{position:fixed;left:0;top:50%;transform:translateY(-50%);z-index:2;display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px 9px;background:rgba(19,15,43,.82);border:1px solid var(--line);border-left:0;border-radius:0 14px 14px 0;text-decoration:none;color:var(--ink);backdrop-filter:blur(8px);transition:box-shadow .2s}
.ig span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:.82rem;letter-spacing:.06em;color:var(--muted)}
.ig:hover{box-shadow:0 0 22px rgba(169,155,255,.5)}.ig:hover span{color:var(--ink)}
/* logo dock */
.dock{display:flex;gap:14px;overflow-x:auto;justify-content:safe center;padding:18px 14px calc(14px + env(safe-area-inset-bottom,0px));scrollbar-width:thin}
.tile{flex:none;width:120px;display:flex;flex-direction:column;gap:8px;background:none;border:0;padding:0;cursor:pointer;text-align:center}
.slot{border-radius:16px;padding:2px;background:var(--line);transition:box-shadow .25s}
.logo{height:66px;display:grid;place-items:center;border-radius:14px;font-weight:800;font-size:1.3rem;color:#12202b;transition:transform .18s ease-out;transform:perspective(520px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(var(--lift,0px));background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(91,72,184,.38),transparent 62%),var(--tile)}
.logo img{max-width:82%;max-height:76%;object-fit:contain}
.name{font-size:.8rem;color:var(--muted);line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tile:hover .logo{--lift:-4px}
.tile:hover .slot{box-shadow:0 0 22px rgba(169,155,255,.35)}
.tile[aria-current="true"] .slot{background:conic-gradient(from var(--a),var(--c1),var(--c2),var(--c3),var(--c1));animation:spin 3s linear infinite;box-shadow:0 0 28px rgba(91,72,184,.65)}
.tile[aria-current="true"] .logo{--lift:-6px}
.tile[aria-current="true"] .name{color:var(--ink);font-weight:600}

.tile.secret .logo{background:linear-gradient(135deg,#17113a,#241a57);color:var(--c2);font-size:1.7rem;text-shadow:0 0 16px var(--c2);position:relative;overflow:hidden}
.tile.secret .logo::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.22),transparent);transform:skewX(-20deg);animation:shine 3.6s ease-in-out infinite}
@media (max-width:720px){.stage{padding:4px 8px 0}.ig{top:calc(env(safe-area-inset-top,0px) + 12px);left:auto;right:108px;transform:none;flex-direction:row;padding:9px 10px;border:1px solid var(--line);border-radius:12px}.ig span{display:none}#dev{display:none}.tile{width:98px}.brand{font-size:1rem}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>

<a class="ig" id="ig" target="_blank" rel="noopener" aria-label="Instagram hesabımız">
  <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="1" fill="currentColor" stroke="none"/></svg>
  <span id="igname"></span>
</a>

<header class="top">
  <div class="brand">
    <img class="bi" data-logo="icon" alt="" onerror="this.hidden=true;this.nextElementSibling.hidden=false">
    <span class="mark" hidden>S7</span>
    <img class="bw" data-logo="word" alt="Sevenqorse" onerror="this.replaceWith(document.createTextNode('Sevenqorse'))">
    <span class="hub">Hub</span>
  </div>
  <a class="cta" href="https://wa.me/905312682132?text=Merhaba%2C%20projem%20hakk%C4%B1nda%20teklif%20almak%20istiyorum." target="_blank" rel="noopener">Teklif al</a>
</header>

<main class="stage">
  <div class="window" id="win">
    <header class="bar">
      <img class="bar-i" data-logo="icon" alt="" onerror="this.remove()">
      <button class="btn" id="close" type="button" hidden>Kapat</button>
      <div class="who"><div id="title">Sevenqorse Hub</div><div id="path"></div></div>
      <button class="btn" id="dev" type="button" aria-pressed="false" hidden>Mobil görünüm</button>
      <a class="btn" id="open" target="_blank" rel="noopener" hidden>Yeni sekmede aç</a>
    </header>
    <div class="view" id="view">
      <section id="welcome">
        <img class="hero-logo" data-logo="icon" alt="Sevenqorse Hub" onerror="this.hidden=true">
        <h1>Sevenqorse Hub</h1>
        <p>Demo odası: aşağıdan bir firma seçin. Sitesi bu pencerede, gerçek bir iç sayfa gibi açılır.</p>
        <div class="chips"><span>Canlı demo</span><span>Mobil uyumlu</span><span>Hızlı teslim</span></div>
      </section>
      <iframe id="frame" title="Demo sitesi" hidden></iframe>
    </div>
  </div>
</main>
<nav class="dock" id="dock" aria-label="Demo siteleri"></nav>

const $ = s => document.querySelector(s);
const reduce = matchMedia("(prefers-reduced-motion:reduce)").matches;

/* parçacık arka planı + tıklama patlaması */
const cv = $("#fx"), cx = cv.getContext("2d");
let W, H, P = [], bursts = [], mouse = { x: -999, y: -999 };
function size() {
  const r = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight; cv.width = W * r; cv.height = H * r; cx.setTransform(r, 0, 0, r, 0, 0);
  const n = Math.min(70, Math.floor(W * H / 18000));
  P = Array.from({ length: n }, () => ({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - .5) * .35, vy: (Math.random() - .5) * .35 }));
}
size(); addEventListener("resize", size);
addEventListener("pointermove", e => { mouse.x = e.clientX; mouse.y = e.clientY; });
function burst(x, y) {
  if (reduce) return;
  for (let i = 0; i < 40; i++) {
    const a = Math.random() * 6.283, s = 2 + Math.random() * 4.5;
    bursts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, l: 1, h: 245 + Math.random() * 55 });
  }
}
function tick() {
  cx.clearRect(0, 0, W, H);
  for (const p of P) {
    p.x += p.vx; p.y += p.vy;
    if (p.x < 0 || p.x > W) p.vx *= -1;
    if (p.y < 0 || p.y > H) p.vy *= -1;
    const dx = mouse.x - p.x, dy = mouse.y - p.y;
    if (Math.hypot(dx, dy) < 140) { p.x -= dx * .004; p.y -= dy * .004; }
    cx.fillStyle = "rgba(190,175,255,.7)"; cx.beginPath(); cx.arc(p.x, p.y, 1.4, 0, 6.283); cx.fill();
  }
  for (let i = 0; i < P.length; i++) for (let j = i + 1; j < P.length; j++) {
    const a = P[i], b = P[j], d = Math.hypot(a.x - b.x, a.y - b.y);
    if (d < 120) { cx.strokeStyle = "rgba(91,72,184," + ((1 - d / 120) * .35) + ")"; cx.beginPath(); cx.moveTo(a.x, a.y); cx.lineTo(b.x, b.y); cx.stroke(); }
  }
  bursts = bursts.filter(b => b.l > 0);
  for (const b of bursts) {
    b.x += b.vx; b.y += b.vy; b.vy += .08; b.vx *= .98; b.l -= .017;
    cx.fillStyle = "hsla(" + b.h + ",90%,65%," + b.l + ")"; cx.beginPath(); cx.arc(b.x, b.y, 2.2 * b.l + .5, 0, 6.283); cx.fill();
  }
  requestAnimationFrame(tick);
}
if (!reduce) tick();

const INSTAGRAM = "sevenqorse"; // Instagram kullanıcı adınız (@ olmadan). Yanlışsa buradan düzeltin
document.getElementById("ig").href = "https://www.instagram.com/" + INSTAGRAM + "/";
document.getElementById("igname").textContent = "@" + INSTAGRAM;

/* demo listesi */
const only = new URLSearchParams(location.search).get("d"); // ?d=slug → yalnızca o müşteri görünür
const list = only ? DEMOS.filter(d => d.slug === only) : DEMOS;
const dock = $("#dock"), frame = $("#frame"), welcome = $("#welcome"), view = $("#view"), win = $("#win");
const title = $("#title"), path = $("#path"), openLink = $("#open"), closeBtn = $("#close"), dev = $("#dev");
const initials = n => n.split(/\s+/).slice(0, 2).map(w => w[0]).join("").toLocaleUpperCase("tr");

list.forEach(d => {
  const b = document.createElement("button"); b.type = "button"; b.className = "tile"; b.dataset.slug = d.slug;
  const slot = document.createElement("span"); slot.className = "slot";
  const lg = document.createElement("span"); lg.className = "logo";
  const nm = document.createElement("span"); nm.className = "name"; nm.textContent = d.name;
  if (d.secret) { b.classList.add("secret"); lg.textContent = d.mark; }
  else { const img = new Image(); img.alt = ""; img.src = d.logo; img.onerror = () => { img.remove(); lg.textContent = initials(d.name); }; lg.append(img); }
  slot.append(lg); b.append(slot, nm);
  b.addEventListener("pointermove", e => {
    const r = lg.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    lg.style.setProperty("--rx", ((.5 - y) * 16) + "deg"); lg.style.setProperty("--ry", ((x - .5) * 16) + "deg");
    lg.style.setProperty("--mx", (x * 100) + "%"); lg.style.setProperty("--my", (y * 100) + "%");
  });
  b.addEventListener("pointerleave", () => ["--rx", "--ry", "--mx", "--my"].forEach(k => lg.style.removeProperty(k)));
  b.addEventListener("click", () => {
    const r = b.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + 30);
    location.hash = d.slug;
  });
  dock.append(b);
});

view.addEventListener("pointermove", e => {
  const r = view.getBoundingClientRect();
  view.style.setProperty("--px", (e.clientX - r.left) + "px"); view.style.setProperty("--py", (e.clientY - r.top) + "px");
});

function show(slug) {
  const d = list.find(x => x.slug === slug);
  document.querySelectorAll(".tile").forEach(t => {
    if (d && t.dataset.slug === slug) { t.setAttribute("aria-current", "true"); t.scrollIntoView({ inline: "center", block: "nearest" }); }
    else t.removeAttribute("aria-current");
  });
  if (!d) {
    frame.hidden = true; frame.removeAttribute("src"); view.classList.remove("ready", "loading");
    welcome.hidden = false; title.textContent = "Sevenqorse Hub"; path.textContent = "";
    openLink.hidden = closeBtn.hidden = dev.hidden = true;
    return;
  }
  const url = d.slug + "/";
  welcome.hidden = true; frame.hidden = false;
  if (frame.getAttribute("src") !== url) {
    view.classList.remove("ready"); view.classList.add("loading");
    frame.onload = () => { view.classList.remove("loading"); view.classList.add("ready"); };
    frame.src = url;
    win.classList.remove("pop"); void win.offsetWidth; win.classList.add("pop");
  }
  title.textContent = d.name; path.textContent = "/" + d.slug + "/";
  openLink.href = url; openLink.hidden = closeBtn.hidden = dev.hidden = false;
}

const current = () => decodeURIComponent(location.hash.slice(1)) || only || "";
closeBtn.addEventListener("click", () => { if (only) show(""); else location.hash = ""; });
dev.addEventListener("click", () => dev.setAttribute("aria-pressed", String(view.classList.toggle("mobile"))));
addEventListener("hashchange", () => show(current()));
show(current());
</script>
